<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canjica Network</title>
    <style>
        /* Estilos da Página (CSS) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4; /* Fundo cinza claro para destacar a caixa branca */
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
        }

        /* Sistema de Abas (Menu) */
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: -3px; /* Puxa as abas para baixo para "grudar" na caixa principal */
            padding-left: 20px;
        }

        .tab {
            border: 3px solid black;
            border-bottom: none;
            background-color: white;
            padding: 10px 40px;
            font-size: 22px;
            text-decoration: none;
            color: black;
            text-transform: uppercase;
        }

        /* Caixa de Conteúdo Principal */
        .content-box {
            border: 3px solid black;
            background-color: white;
            padding: 50px 20px;
            text-align: center;
        }

        .logo {
            max-width: 400px;
            height: auto;
            margin-bottom: 30px;
        }

        .description {
            font-size: 22px;
            margin: 0 auto 40px auto;
            line-height: 1.4;
        }

        .headline {
            font-size: 42px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        /* Área do Álbum e Botão */
        .action-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap; /* Permite quebrar linha em telas pequenas */
        }

        .album-placeholder {
            font-size: 28px;
            font-weight: bold;
        }

        .btn-ouvir {
            background-color: #e62429; /* Vermelho inspirado na sua logo */
            color: black;
            font-weight: bold;
            font-size: 32px;
            text-decoration: none;
            padding: 20px 60px;
            display: inline-block;
            transition: transform 0.2s; /* Efeito suave ao passar o mouse */
        }

        .btn-ouvir:hover {
            transform: scale(1.05); /* Aumenta um pouquinho o botão no hover */
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Abas de Navegação -->
        <div class="tabs">
            <a href="#" class="tab">INICIO</a>
            <a href="#" class="tab">NOTICIAS</a>
            <a href="#" class="tab">KAISER</a>
        </div>

        <!-- Conteúdo Principal -->
        <div class="content-box">
            <!-- Imagem da Logo -->
            <img src="Logo Canjica.png" alt="Canjica Network Logo" class="logo">

            <!-- Texto de Descrição -->
            <p class="description">
                empresa legal cheia de videos<br>
                legais aura eu sou o polnas!
            </p>

            <!-- Título Principal -->
            <div class="headline">
                VEJA: DDD23 LANÇA<br>NOVO ALBUM
            </div>

            <!-- Área de Ação (Imagem do Álbum e Botão) -->
            <div class="action-area">
                <div class="album-placeholder">
                    [Mr. Andrey & The Big Kaisers.png]
                </div>
                
                <!-- Botão com o link do YouTube que você colocou no mockup -->
                <a href="https://youtu.be/yuk_pBFBB5s" target="_blank" class="btn-ouvir">OUVIR</a>
            </div>
        </div>
    </div>

</body>
</html>
