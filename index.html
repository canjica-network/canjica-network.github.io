<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canjica Network</title>
    <!-- Fonte Gamer/Tech do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: #0b0b0e;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            height: 100vh; /* Ocupa 100% da altura da tela */
            display: flex;
            flex-direction: column;
        }

        /* Sistema de Abas */
        .tabs {
            display: flex;
            gap: 10px;
            padding: 20px 20px 0 20px;
        }

        .tab {
            border: 2px solid #ff4766;
            border-bottom: none;
            background-color: #16161e;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            color: #ff4766;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 -5px 15px rgba(255, 71, 102, 0.1);
        }

        .tab:hover {
            background-color: #ff4766;
            color: #0b0b0e;
            box-shadow: 0 -5px 20px rgba(255, 71, 102, 0.5);
        }

        /* Caixa de Conteúdo em Tela Cheia */
        .content-box {
            border: 2px solid #ff4766;
            background-color: #121218;
            background-image: radial-gradient(circle at center, #1a1a24 0%, #121218 100%);
            margin: 0 20px 20px 20px;
            flex-grow: 1; /* Preenche todo o resto da tela */
            box-shadow: 0 0 25px rgba(255, 71, 102, 0.15), inset 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .logo {
            max-width: 500px;
            width: 100%;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(255, 71, 102, 0.3));
        }

        .description {
            font-size: 24px;
            margin-bottom: 30px;
            color: #a0a0b0;
            line-height: 1.5;
        }

        .headline {
            font-size: 48px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 40px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .action-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* Estilo da Imagem da Capa do Álbum */
        .album-cover {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border: 2px solid #ff4766;
            box-shadow: 0 0 20px rgba(255, 71, 102, 0.4);
            border-radius: 4px;
        }

        /* Botão Cyberpunk */
        .btn-ouvir {
            background-color: #ff4766;
            color: #000;
            font-weight: bold;
            font-size: 38px;
            text-decoration: none;
            padding: 20px 80px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 71, 102, 0.5);
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            transition: all 0.2s ease;
        }

        .btn-ouvir:hover {
            background-color: #ff6b85;
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 71, 102, 0.8);
        }
    </style>
</head>
<body>

    <!-- Abas -->
    <div class="tabs">
        <a href="#" class="tab">INICIO</a>
        <a href="#" class="tab">NOTICIAS</a>
        <a href="#" class="tab">KAISER</a>
    </div>

    <!-- Conteúdo Principal Tela Cheia -->
    <div class="content-box">
        <img src="Logo Canjica.png" alt="Canjica Network Logo" class="logo">

        <p class="description">
            empresa legal cheia de videos<br>
            legais aura eu sou o polnas!
        </p>

        <div class="headline">
            VEJA: DDD23 LANÇA<br>NOVO ALBUM
        </div>

        <div class="action-area">
            <!-- Capa do álbum em imagem real -->
            <img src="Mr. Andrey & The Big Kaisers.png" alt="Mr. Andrey & The Big Kaisers" class="album-cover">
            
            <a href="https://youtu.be/yuk_pBFBB5s" target="_blank" class="btn-ouvir">OUVIR</a>
        </div>
    </div>

</body>
</html>
